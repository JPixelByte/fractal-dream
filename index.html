<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="fractalz.png">
    <title>Prime Fractal Space-Sleep Engine</title>
    <style>
        /* Base Themes */
        :root {
            --bg-color: #040408;
            --panel-bg: rgba(255, 255, 255, 0.03);
            --border-color: #00ff66;
            --text-color: #00ff66;
            --btn-hover-bg: #00ff66;
            --btn-hover-text: #040408;
            --status-color: #ff33aa;
            --breathe-speed: 8s;
        }

        [data-theme="light"] {
            --bg-color: #f4edd2; /* Soft sepia background to protect from head pain */
            --panel-bg: rgba(0, 0, 0, 0.04);
            --border-color: #5c4a3c;
            --text-color: #4a3728;
            --btn-hover-bg: #4a3728;
            --btn-hover-text: #f4edd2;
            --status-color: #b8235a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            transition: background-color 0.5s ease, color 0.5s ease;
            animation: pulseBg var(--breathe-speed) ease-in-out infinite, 
               delayReverse 0.5s ease 0s 1 normal;
             -webkit-animation:pulseBg var(--breathe-speed) ease-in-out infinite, delayReverse 0.5s ease 0s 1 normal;
            
            /* animation: pulseBg var(--breathe-speed) ease-in-out infinite;
            animation: delayReverse 0.5s ease 0s 1 normal;
            -webkit-animation: delayReverse 0.5s ease 0s 1 normal; */
        }

        #control-panel {
            margin-top: 15px;
            padding: 15px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: center;
            max-width: 95vw;
            z-index: 10;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        label {
            font-size: 12px;
            font-weight: bold;
        }

        input[type=range] {
            width: 140px;
            accent-color: var(--border-color);
        }

        select, button {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        select {
            background-color: var(--bg-color);
        }

        button:hover, select:hover {
            background: var(--btn-hover-bg);
            color: var(--btn-hover-text);
        }

        #canvas-container {
            position: relative;
            width: 95vw;
            height: 70vh;
            margin-top: 15px;
            border: 1px solid var(--panel-bg);
            border-radius: 6px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        #status-overlay {
            position: absolute;
            bottom: 15px;
            left: 15px;
            font-size: 12px;
            font-weight: bold;
            color: var(--status-color);
            pointer-events: none;
            max-width: 80%;
        }

        .audio-wave-container {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            width: 50px;
            height: 30px;
            margin-left: 15px;
            padding: 2px;
}
/* Start of: Animating Dancing Bars CSS for Sound Visualization */
    .wave-bar {
        width: 6px;
        height: 3px; /* Flat rest height */
        background-color: var(--border-color);
        border-radius: 3px;
        transition: background-color 0.5s ease, height 0.15s ease-in-out;
    }

    /* Active CSS keyframe animations for varied rhythm */
    @keyframes danceBar1 { 0%, 100% { height: 6px; } 50% { height: 26px; } }
    @keyframes danceBar2 { 0%, 100% { height: 28px; } 50% { height: 8px; } }
    @keyframes danceBar3 { 0%, 100% { height: 12px; } 50% { height: 30px; } }
    @keyframes danceBar4 { 0%, 100% { height: 24px; } 50% { height: 10px; } }
    @keyframes danceBar5 { 0%, 100% { height: 8px; } 50% { height: 22px; } }

    .audio-wave-container.playing .bar-1 { animation: danceBar1 0.6s ease-in-out infinite; }
    .audio-wave-container.playing .bar-2 { animation: danceBar2 0.7s ease-in-out infinite; }
    .audio-wave-container.playing .bar-3 { animation: danceBar3 0.5s ease-in-out infinite; }
    .audio-wave-container.playing .bar-4 { animation: danceBar4 0.8s ease-in-out infinite; }
    .audio-wave-container.playing .bar-5 { animation: danceBar5 0.65s ease-in-out infinite; }

/* End of: Animating Dancing Bars CSS for Sound Visualization */

/* Start of: GSAP-Animated Bottom Control Navbar CSS  */

.bottom-nav-container {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 30px;
    padding: 10px 25px;
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 30px;
    backdrop-filter: blur(10px);
    z-index: 100;
}

.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    padding: 5px 10px;
    transition: color 0.3s ease;
}

.nav-icon {
    font-size: 20px;
    margin-bottom: 4px;
}

.nav-label {
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* End of: GSAP-Animated Bottom Control Navbar CSS  */


/* Start of: Keyframe Animation */
@keyframes delay {

0%,
33% {
    transform: scaleY(1);
    -webkit-transform: scaleY(2222);
    -webkit-transform: scaleX(222);
}

66% {
    transform: scaleY(60);
    -webkit-transform: scaleY(2222);
    -webkit-transform: scaleX(222);
}

100% {
    transform: scaleY(1);
    -webkit-transform: scaleY(1);
}
}

@keyframes delayReverse {
0% {
    transform: scaleY(1);
    -webkit-transform: scaleY(1);
}

33% {
    transform: scaleY(1);
    -webkit-transform: scaleY(2222);
    -webkit-transform: scaleX(222);
}

66% {
    transform: scaleY(60);
    -webkit-transform: scaleY(2222);
    -webkit-transform: scaleX(222);
}

100% {
    transform: scaleY(1);
    -webkit-transform: scaleY(1);
    }
}

    @keyframes pulseBg {
    0%, 100% { opacity: 0.95; }
    50% { opacity: 1; }
}

/* End of: Keyframe Animations */
</style>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

</head>
<body>

    <div id="control-panel">
        <div class="control-group">
            <button id="themeToggle">🌓 Toggle Theme</button>
        </div>

        <div class="control-group">
            <label for="speedSlider">🐑 Star Drift Speed</label>
            <input type="range" id="speedSlider" min="1" max="100" value="20">
        </div>

        <div class="control-group">
            <label for="noiseSelect">🔊 Sound Profile</label>
            <select id="noiseSelect">
                <option value="none">Mute Audio</option>
                <option value="pink">Pink Noise (Deep Rain)</option>
                <option value="white">White Noise (Static)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="binauralSelect">🧠 Binaural Beats</label>
            <select id="binauralSelect">
                <option value="none">Binaural Off</option>
                <option value="delta">Deep Sleep Delta (2Hz)</option>
                <option value="theta">Dreamy Theta (6Hz)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="volumeSlider">🔈 Master Volume</label>
            <input type="range" id="volumeSlider" min="0" max="100" value="25">
        </div>

            <!-- 🎛️ New Sound Spectrum Visualizer Wave Container -->
                <div id="audio-wave" class="audio-wave-container">
                    <span class="wave-bar bar-1"></span>
                    <span class="wave-bar bar-2"></span>
                    <span class="wave-bar bar-3"></span>
                    <span class="wave-bar bar-4"></span>
                    <span class="wave-bar bar-5"></span>
                </div>
    </div>

    <div id="canvas-container">
        <canvas id="galaxyCanvas"></canvas>
        <div id="status-overlay">--- Waiting for calculation ---</div>
    </div>

    <!-- 🧭 GSAP-Animated Bottom Control Navbar -->
    <div id="bottom-navbar" class="bottom-nav-container">
        <div class="nav-item" id="nav-mute" onclick="toggleMasterMute()">
            <span class="nav-icon">🔇</span>
            <span class="nav-label">Quick Mute</span>
        </div>
        <div class="nav-item" id="nav-dim" onclick="toggleScreenDim()">
            <span class="nav-icon">🌙</span>
            <span class="nav-label">Eye Saver</span>
        </div>
        <div class="nav-item" id="nav-reset" onclick="resetGalaxyFractal()">
            <span class="nav-icon" onClick="window.location.reload(); loop()">🔄</span>
            <span class="nav-label">Reset Math</span>
        </div>
    </div>


    <script>
        if (typeof disableLoopProtection === 'function') { disableLoopProtection(); }

        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');
        const statusOverlay = document.getElementById('status-overlay');
        
        // UI Elements
        const themeToggle = document.getElementById('themeToggle');
        const speedSlider = document.getElementById('speedSlider');
        const noiseSelect = document.getElementById('noiseSelect');
        const binauralSelect = document.getElementById('binauralSelect');
        const volumeSlider = document.getElementById('volumeSlider');
        const audioWave = document.getElementById('audio-wave');

        noiseSelect.addEventListener('change', (e) => {
            checkAudioInit();
            playAmbientNoise(e.target.value);
            
            // Toggle the rhythmic dancing state based on selection
            if (e.target.value !== 'none') {
                audioWave.classList.add('playing');
            } else {
                audioWave.classList.remove('playing');
            }
        });
        // Setup Canvas Size
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Core State Engine variables
        let primeCounter = 0;
        let currentNumber = 2;
        let stars = [];
        const maxStars = 350; 
        const MAX_ITER = 60; // Lower iteration for soft background trails

        // Audio System State
        let audioCtx = null;
        let ambientNoiseNode = null;
        let binLeftOsc = null;
        let binRightOsc = null;
        let masterGain = null;

        // Math Helpers
        function isPrime(num) {
            if (num <= 1) return false;
            if (num <= 3) return true;
            if (num % 2 === 0 || num % 3 === 0) return false;
            for (let i = 5; i * i <= num; i += 6) {
                if (num % i === 0 || num % (i + 2) === 0) return false;
            }
            return true;
        }

        function getMandelbrotValue(cr, ci, maxIter) {
            let zr = 0.0, zi = 0.0, iter = 0;
            while (zr * zr + zi * zi <= 4.0 && iter < maxIter) {
                let temp = zr * zr - zi * zi + cr;
                zi = 2.0 * zr * zi + ci;
                zr = temp;
                iter++;
            }
            return iter;
        }

        // Generate a new star using fresh Prime and Fractal computations
        function calculateNextPrimeStar() {
            while (!isPrime(currentNumber)) {
                currentNumber++;
            }
            
            primeCounter++;
            const prime = currentNumber;
            currentNumber++; // Move next for next tick

            // Status notice generation at intervals
            if (primeCounter % 1000 === 0) {
                statusOverlay.innerText = `--- [ Prime Count: ${primeCounter} ] Are You Asleep Yet, or Still Counting Fractal Primes. ---`;
            }

            // Map the calculated prime mapping onto a Mandelbrot coordinate space
            const angle = prime * 0.0005;
            const scale = (prime % 100) / 100;
            const cr = (Math.sin(angle) * 1.5) * scale;
            const ci = (Math.cos(angle) * 1.5) * scale;
            const iterations = getMandelbrotValue(cr, ci, MAX_ITER);

            // Create a localized floating "z" tracking star parameter
            return {
                x: canvas.width / 2 + (Math.sin(prime) * (canvas.width * 0.35)),
                y: canvas.height / 2 + (Math.cos(prime) * (canvas.height * 0.35)),
                size: Math.max(9, (iterations % 18) + 6),
                alpha: Math.min(0.8, (iterations / MAX_ITER) + 0.1),
                primeScale: angle,
                speedFactor: (prime % 5) + 1,
                seed: prime
            };
        }

        // Initialize Audio context on human interaction
        function checkAudioInit() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.gain.setValueAtTime(volumeSlider.value / 100, audioCtx.currentTime);
                masterGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Sound Generators
        function stopAmbientNoise() {
            if (ambientNoiseNode) {
                ambientNoiseNode.stop();
                ambientNoiseNode.disconnect();
                ambientNoiseNode = null;
            }
        }

        function playAmbientNoise(type) {
            stopAmbientNoise();
            if (type === 'none' || !audioCtx) return;

            const bufferSize = 4 * audioCtx.sampleRate;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);

            if (type === 'white') {
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
            } else if (type === 'pink') {
                // Pink noise generation algorithm approximation
                let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
                for (let i = 0; i < bufferSize; i++) {
                    let white = Math.random() * 2 - 1;
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                    data[i] *= 0.11; // Adjust gain structure for compliance
                    b6 = white * 0.115926;
                }
            }

            ambientNoiseNode = audioCtx.createBufferSource();
            ambientNoiseNode.buffer = buffer;
            ambientNoiseNode.loop = true;
            ambientNoiseNode.connect(masterGain);
            ambientNoiseNode.start();
        }

        function stopBinauralBeats() {
            if (binLeftOsc) { binLeftOsc.stop(); binLeftOsc.disconnect(); binLeftOsc = null; }
            if (binRightOsc) { binRightOsc.stop(); binRightOsc.disconnect(); binRightOsc = null; }
        }

        function playBinauralBeats(mode) {
            stopBinauralBeats();
            if (mode === 'none' || !audioCtx) return;

            let baseFreq = 100; // Low frequency base tone for relaxation
            let offset = (mode === 'delta') ? 2 : 6; 

            // Create Stereo Panner Nodes to split sounds to left and right ears
            let leftPanner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
            let rightPanner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;

            binLeftOsc = audioCtx.createOscillator();
            binLeftOsc.type = 'sine';
            binLeftOsc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);

            binRightOsc = audioCtx.createOscillator();
            binRightOsc.type = 'sine';
            binRightOsc.frequency.setValueAtTime(baseFreq + offset, audioCtx.currentTime);

            // Connect using modern panners if supported, fallback to simple mix
            if (leftPanner && rightPanner) {
                leftPanner.pan.setValueAtTime(-1, audioCtx.currentTime);
                rightPanner.pan.setValueAtTime(1, audioCtx.currentTime);
                
                binLeftOsc.connect(leftPanner).connect(masterGain);
                binRightOsc.connect(rightPanner).connect(masterGain);
            } else {
                binLeftOsc.connect(masterGain);
                binRightOsc.connect(masterGain);
            }

            binLeftOsc.start();
            binRightOsc.start();
        }

        // Interaction Event Listeners
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const targetTheme = (currentTheme === 'light') ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', targetTheme);
        });

        noiseSelect.addEventListener('change', (e) => {
            checkAudioInit();
            playAmbientNoise(e.target.value);
        });

        binauralSelect.addEventListener('change', (e) => {
            checkAudioInit();
            playBinauralBeats(e.target.value);
        });

        volumeSlider.addEventListener('input', (e) => {
            if (masterGain) {
                masterGain.gain.setValueAtTime(e.target.value / 100, audioCtx.currentTime);
            }
        });

        // Initialize background stars array structure
        for(let i=0; i < maxStars; i++) {
            let initialStar = calculateNextPrimeStar();
            // Randomly scatter initial stars across screen space initially
            initialStar.x = Math.random() * canvas.width;
            initialStar.y = Math.random() * canvas.height;
            stars.push(initialStar);
        }

        // Primary Canvas Render Loop
        function renderGalaxyLoop() {
            const globalSpeed = speedSlider.value * 0.05;
            const theme = document.documentElement.getAttribute('data-theme') || 'dark';

            // Slow fade effect to create soft trail dynamics
            ctx.fillStyle = (theme === 'light') ? "rgba(244, 237, 210, 0.08)" : "rgba(4, 4, 8, 0.08)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Establish text rendering parameters
            ctx.font = "bold 14px 'Courier New', Courier, monospace";

            for (let i = 0; i < stars.length; i++) {
                let star = stars[i];

                // Orbital drift mechanics derived from initial calculating constants
                star.x += Math.sin(star.primeScale) * (globalSpeed * star.speedFactor * 0.3);
                star.y += (globalSpeed * star.speedFactor * 0.4);

                // Re-cycle calculation node when star slips past limits
                if (star.y > canvas.height || star.x < 0 || star.x > canvas.width) {
                    stars[i] = calculateNextPrimeStar();
                    stars[i].y = 0; // Respawn cleanly at top boundaries
                }

                // Render execution frame
                ctx.fillStyle = (theme === 'light') 
                    ? `rgba(74, 55, 40, ${star.alpha})` 
                    : `rgba(0, 255, 102, ${star.alpha})`;
                
                ctx.font = `${star.size}px 'Courier New', Courier, monospace`;
                ctx.fillText("z", star.x, star.y);
            }

            requestAnimationFrame(renderGalaxyLoop);
        }

        // Start animation processing loop execution
        renderGalaxyLoop();
    </script>

     <!-- Load your custom external engine code last -->
    <script src="fractal-gsap-engine.js"></script>
</body>
</html>
